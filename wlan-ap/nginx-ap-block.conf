        # --- AP-Captive-Portal (marv-kvm, 192.192.193.1) -------------------
        # Adressspezifische Bindung schlaegt das generische "listen 80",
        # gilt also nur fuer WLAN-Clients. Ethernet bleibt unveraendert.

        # 1) Probe-URLs der Betriebssysteme -> Weiterleitung auf den Login.
        #    Wildcard-DNS von dnsmasq loest diese Namen auf 192.192.193.1 auf.
        server {
                listen 192.192.193.1:80;
                server_name captive.apple.com
                            connectivitycheck.gstatic.com
                            connectivitycheck.android.com
                            clients3.google.com
                            www.msftconnecttest.com
                            www.msftncsi.com
                            detectportal.firefox.com
                            nmcheck.gnome.org
                            network-test.debian.org;

                location / {
                        proxy_pass http://127.0.0.1:8088;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header Host $host;
                }
        }

        # 2) Alles andere ueber den AP: KVM-Oberflaeche im Klartext,
        #    damit der Captive-Browser nicht ueber das selbstsignierte
        #    Zertifikat stolpert.
        server {
                listen 192.192.193.1:80 default_server;
                server_name _;
                include /etc/kvmd/nginx/gl.ctx-server.conf;
                include /usr/share/kvmd/extras/*/nginx.ctx-server.conf;

                location /connect {
                        return 301 /;
                }

                # Infoseite fuer den Anmeldeassistenten
                location /captive/ {
                        proxy_pass http://127.0.0.1:8088;
                        proxy_set_header X-Real-IP $remote_addr;
                        auth_request off;
                }

                location /portal/ {
                        alias /userdata/wlan-ap/portal/;
                        index index.html;
                        auth_request off;
                        include /etc/kvmd/nginx/loc-nocache.conf;
                }
        }
        # --- Ende AP-Captive-Portal ----------------------------------------
