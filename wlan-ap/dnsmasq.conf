interface=wlan0
bind-interfaces
except-interface=lo
listen-address=192.192.193.1
no-resolv
no-hosts
filter-AAAA
# Wildcard: jeder Name loest auf die KVM auf -> Captive-Erkennung greift
address=/#/192.192.193.1
dhcp-range=192.192.193.100,192.192.193.150,255.255.255.0,12h
dhcp-option=3,192.192.193.1
dhcp-option=6,192.192.193.1
# RFC 8910: Portal-URI direkt an den Client (iOS 14+, Android 11+)
dhcp-option=114,"http://192.192.193.1/portal/"
